<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Receitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Receitas Cadastradas</h4>
            <div>
                <a href="{{ url_for('nova_receita') }}" class="btn btn-success btn-sm">+ Nova Receita</a>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary btn-sm">Sair</a>
            </div>
        </div>

        <div class="card mb-3 shadow-sm">
            <div class="card-body">
                <form method="GET" action="{{ url_for('listar_receitas') }}" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label mb-1">Data início</label>
                        <input type="date" name="data_inicio" class="form-control form-control-sm" value="{{ data_inicio }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Data fim</label>
                        <input type="date" name="data_fim" class="form-control form-control-sm" value="{{ data_fim }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1">Tipo</label>
                        <select name="tipo" class="form-select form-select-sm">
                            <option value="">Todos</option>
                            <option value="s" {{ 'selected' if tipo == 's' }}>Salgado</option>
                            <option value="d" {{ 'selected' if tipo == 'd' }}>Doce</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm w-100">Filtrar</button>
                        <a href="{{ url_for('listar_receitas') }}" class="btn btn-outline-secondary btn-sm w-100">Limpar</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Data Registro</th>
                            <th>Custo</th>
                            <th>Tipo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for r in receitas %}
                        <tr>
                            <td>{{ r[0] }}</td>
                            <td>{{ r[1] }}</td>
                            <td>{{ r[2] }}</td>
                            <td>{{ r[3] }}</td>
                            <td>R$ {{ "%.2f"|format(r[4]) }}</td>
                            <td>
                                {% if r[5] == 'd' %}
                                    <span class="badge bg-warning text-dark">Doce</span>
                                {% else %}
                                    <span class="badge bg-secondary">Salgado</span>
                                {% endif %}
                            </td>
                            <td>
                                <a href="{{ url_for('editar_receita', receita_id=r[0]) }}" class="btn btn-warning btn-sm">Editar</a>
                                <a href="{{ url_for('exportar_receita_pdf', id=r[0]) }}" class="btn btn-info btn-sm text-white">PDF</a>
                                <form method="POST" action="{{ url_for('deletar_receita', id=r[0]) }}" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Deseja deletar?')">Deletar</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
